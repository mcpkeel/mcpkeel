version: 2
updates:
  # Actions are pinned by commit; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  # Two runtime dependencies, both pinned. New releases wait two weeks, so a
  # compromised one has time to be caught before it is proposed here.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
